name: CI Quality Gates

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb

      - name: Python syntax checks
        run: python -m py_compile scripts/*.py

      - name: Shell syntax checks
        run: |
          for f in scripts/*.sh .devcontainer/postCreateCommand.sh; do
            bash -n "$f"
          done

      - name: Run Phase 6 quality controls when db exists
        run: |
          if [[ -f data/duckdb/scr.duckdb ]]; then
            python scripts/build_ops_phase_6_1.py --db-path data/duckdb/scr.duckdb --default-freshness-hours 6 --fail-on-breach
          else
            echo "No DuckDB artifact found in CI workspace; skipping runtime quality controls."
          fi

      - name: Validate Phase 6.2 defense assets
        run: python scripts/validate_phase_6_2_assets.py
